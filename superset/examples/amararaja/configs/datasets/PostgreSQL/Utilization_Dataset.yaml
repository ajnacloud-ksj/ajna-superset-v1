sql: "SELECT \r\n        battery_name,\r\n        source_table_name,\r\n        start_time_fmt,\r\
  \n        report_end_time_fmt,\r\n        datetime_fmt,\r\n        batch_no,\r\n\
  \        LAG(report_end_time_fmt) OVER (PARTITION BY source_table_name ORDER BY\
  \ datetime_fmt) AS prev_report_end_time,\r\n        -- Handle crossing midnight\
  \ by converting both times to full TIMESTAMP\r\n        CASE \r\n            WHEN\
  \ LAG(report_end_time_fmt) OVER (PARTITION BY source_table_name ORDER BY datetime_fmt)\
  \ IS NOT NULL\r\n            THEN \r\n                -- If the previous report_end_time\
  \ is greater than current start_time, it means we crossed midnight\r\n         \
  \       CASE \r\n                    WHEN CAST(start_time_fmt AS TIME) < CAST(LAG(report_end_time_fmt)\
  \ OVER (PARTITION BY source_table_name ORDER BY datetime_fmt) AS TIME)\r\n     \
  \               THEN \r\n                        -- Add 1 day to the previous report_end_time\
  \ to account for the next day\r\n                        ABS(EXTRACT(EPOCH FROM\
  \ (\r\n                            (CAST(datetime_fmt AS DATE) + CAST(start_time_fmt\
  \ AS TIME)) - \r\n                            ((CAST(datetime_fmt AS DATE) - INTERVAL\
  \ '1 day') + CAST(LAG(report_end_time_fmt) OVER (PARTITION BY source_table_name\
  \ ORDER BY datetime_fmt) AS TIME))\r\n                        )))\r\n          \
  \          ELSE \r\n                        -- Normal case: same day calculation\r\
  \n                        ABS(EXTRACT(EPOCH FROM (\r\n                         \
  \   (CAST(datetime_fmt AS DATE) + CAST(start_time_fmt AS TIME)) - \r\n         \
  \                   (CAST(datetime_fmt AS DATE) + CAST(LAG(report_end_time_fmt)\
  \ OVER (PARTITION BY source_table_name ORDER BY datetime_fmt) AS TIME))\r\n    \
  \                    )))\r\n                END\r\n            ELSE NULL\r\n   \
  \     END AS idle_time_sec\r\n    FROM abd1_mixers_all\r\n    ORDER BY datetime_fmt\
  \ DESC"
