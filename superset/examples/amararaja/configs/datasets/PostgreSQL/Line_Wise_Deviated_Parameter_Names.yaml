table_name: Line Wise Deviated Parameter Names
main_dttm_col: datetime_fmt
description: null
default_endpoint: null
offset: 0
cache_timeout: null
catalog: postgres
schema: public
sql: "SELECT \r\n        CASE \r\n          WHEN source_table_name = 'ABD1_Mixer_1'\
  \ THEN 'Line1'\r\n          WHEN source_table_name = 'ABD1_Mixer_2' THEN 'Line2'\r\
  \n          WHEN source_table_name = 'ABD1_Mixer_3' THEN 'Line3'\r\n          ELSE\
  \ source_table_name\r\n        END AS \"Line_Name\",\r\n        datetime_fmt,\r\n\
  \        unnest(ARRAY[\r\n            CASE WHEN density_deviation_ind = 1 THEN 'Density'\
  \ END,\r\n            CASE WHEN dm_water_deviation_ind = 1 THEN 'DM Water' END,\r\
  \n            CASE WHEN dump_temp_deviation_ind = 1 THEN 'Dump Temp' END,\r\n  \
  \          CASE WHEN dry_mix_time_deviation_ind = 1 THEN 'Dry Mix Time' END,\r\n\
  \            CASE WHEN lead_oxide_deviation_ind = 1 THEN 'Lead Oxide' END,\r\n \
  \           CASE WHEN acid_dump_time_deviation_ind = 1 THEN 'Acid Dump Time' END,\r\
  \n            CASE WHEN peak_temp_deviation_ind = 1 THEN 'Peak Temp' END,\r\n  \
  \          CASE WHEN acid_addition_deviation_ind = 1 THEN 'Acid Addition' END,\r\
  \n            CASE WHEN pentration_deviation_ind = 1 THEN 'Pentration' END,\r\n\
  \            CASE WHEN trim_water_deviation_ind = 1 THEN 'Trim Water' END,\r\n \
  \           CASE WHEN water_dump_time_deviation_ind = 1 THEN 'Water Dump Time' END,\r\
  \n            CASE WHEN wet_mix_time_deviation_ind = 1 THEN 'Wet Mix Time' END,\r\
  \n            CASE WHEN cooling_on_temp_deviation_ind = 1 THEN 'Cooling On Temp'\
  \ END,\r\n            CASE WHEN air_cooling_temp_deviation_ind = 1 THEN 'Air Cooling\
  \ Temp' END,\r\n            CASE WHEN water_cooling_temp_in_deviation_ind = 1 THEN\
  \ 'Water Cooling Temp' END,\r\n            CASE WHEN final_mix_time_deviation_ind\
  \ = 1 THEN 'Final Mix Time' END\r\n        ]) AS \"Deviated_Paramter_Names\"\r\n\
  \    FROM abd1_mixers_all\r\n      where \r\n      {% if from_dttm %}\r\n      \
  \      datetime_fmt > '{{ from_dttm }}' AND\r\n        {% endif %}\r\n        {%\
  \ if to_dttm %}\r\n            datetime_fmt < '{{ to_dttm }}' AND\r\n        {%\
  \ endif %}\r\n      battery_name not in ('trail', '') AND\r\n      (\r\n       \
  \   density_deviation_ind = 1 OR\r\n          dm_water_deviation_ind = 1 OR\r\n\
  \          dump_temp_deviation_ind = 1 OR\r\n          dry_mix_time_deviation_ind\
  \ = 1 OR\r\n          lead_oxide_deviation_ind = 1 OR\r\n          acid_dump_time_deviation_ind\
  \ = 1 OR\r\n          peak_temp_deviation_ind = 1 OR\r\n          acid_addition_deviation_ind\
  \ = 1 OR\r\n          pentration_deviation_ind = 1 OR\r\n          trim_water_deviation_ind\
  \ = 1 OR\r\n          water_dump_time_deviation_ind = 1 OR\r\n          wet_mix_time_deviation_ind\
  \ = 1 OR\r\n          cooling_on_temp_deviation_ind = 1 OR\r\n          air_cooling_temp_deviation_ind\
  \ = 1 OR\r\n          water_cooling_temp_in_deviation_ind = 1\r\n      )"
