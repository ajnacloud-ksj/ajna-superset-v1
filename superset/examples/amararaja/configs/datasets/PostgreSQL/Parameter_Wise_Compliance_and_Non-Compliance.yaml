table_name: Parameter Wise Compliance and Non-Compliance
main_dttm_col: datetime_fmt
description: null
default_endpoint: null
offset: 0
cache_timeout: null
catalog: postgres
schema: public
sql: "\r\n    \r\n    SELECT \r\n        'Density of Paste' AS category,\r\n     \
  \   density AS category_value,\r\n        past_density_spec_min AS LSL,\r\n    \
  \    past_density_spec_max AS USL,\r\n        ABS(LAG(density) OVER (PARTITION BY\
  \ source_table_name,battery_name ORDER BY datetime_fmt) - density) AS abs_diff,\r\
  \n        datetime_fmt,\r\n        source_table_name,\r\n        battery_name\r\n\
  \    FROM abd1_mixers_all\r\n     WHERE (\r\n        {% if from_dttm %}\r\n    \
  \        datetime_fmt > '{{ from_dttm }}' AND\r\n        {% endif %}\r\n       \
  \ {% if to_dttm %}\r\n            datetime_fmt < '{{ to_dttm }}' AND\r\n       \
  \ {% endif %}\r\n        battery_name not in ('trail', '')\r\n    )\r\n    \r\n\
  \    UNION ALL\r\n    \r\n     SELECT \r\n        'Penetration of Paste' AS category,\r\
  \n        pentration AS category_value,\r\n        pentration_value_spec_min AS\
  \ LSL,\r\n        pentration_value_spec_max AS USL,\r\n        ABS(LAG(pentration)\
  \ OVER (PARTITION BY source_table_name,battery_name ORDER BY datetime_fmt) - pentration)\
  \ AS abs_diff,\r\n        datetime_fmt,\r\n        source_table_name,\r\n      \
  \  battery_name\r\n    FROM abd1_mixers_all\r\n     WHERE (\r\n        {% if from_dttm\
  \ %}\r\n            datetime_fmt > '{{ from_dttm }}' AND\r\n        {% endif %}\r\
  \n        {% if to_dttm %}\r\n            datetime_fmt < '{{ to_dttm }}' AND\r\n\
  \        {% endif %}\r\n       battery_name not in ('trail', '')\r\n    )\r\n  \
  \  \r\n    UNION ALL\r\n    \r\n    \r\n    SELECT \r\n        'Acid Dump Time (Sec)'\
  \ AS category,\r\n        acid_dump_time AS category_value,\r\n        acid_add_time_spec_min\
  \ AS LSL,\r\n        acid_add_time_spec_max AS USL,\r\n        ABS(LAG(acid_dump_time)\
  \ OVER (PARTITION BY source_table_name,battery_name ORDER BY datetime_fmt) - acid_dump_time)\
  \ AS abs_diff,\r\n        datetime_fmt,\r\n        source_table_name,\r\n      \
  \  battery_name\r\n    FROM abd1_mixers_all\r\n     WHERE (\r\n        {% if from_dttm\
  \ %}\r\n            datetime_fmt > '{{ from_dttm }}' AND\r\n        {% endif %}\r\
  \n        {% if to_dttm %}\r\n            datetime_fmt < '{{ to_dttm }}' AND\r\n\
  \        {% endif %}\r\n        battery_name not in ('trail', '')\r\n    )\r\n\r\
  \n    UNION ALL\r\n\r\n    SELECT \r\n        'Air Cooling Temp' AS category,\r\n\
  \        air_cooling_temp AS category_value,\r\n        air_cooing_temp_spec_min\
  \ AS LSL,\r\n        air_cooing_temp_spec_max AS USL,\r\n        ABS(LAG(air_cooling_temp)\
  \ OVER (PARTITION BY source_table_name,battery_name ORDER BY datetime_fmt) - air_cooling_temp)\
  \ AS abs_diff,\r\n        datetime_fmt,\r\n        source_table_name,\r\n      \
  \  battery_name\r\n    FROM abd1_mixers_all\r\n     WHERE (\r\n        {% if from_dttm\
  \ %}\r\n            datetime_fmt > '{{ from_dttm }}' AND\r\n        {% endif %}\r\
  \n        {% if to_dttm %}\r\n            datetime_fmt < '{{ to_dttm }}' AND\r\n\
  \        {% endif %}\r\n        battery_name not in ('trail', '')\r\n    )\r\n\r\
  \n    UNION ALL\r\n\r\n    SELECT \r\n        'Peak Temp' AS category,\r\n     \
  \   peak_temp AS category_value,\r\n        peak_temp_spec_min AS LSL,\r\n     \
  \   peak_temp_spec_max AS USL,\r\n        ABS(LAG(peak_temp) OVER (PARTITION BY\
  \ source_table_name,battery_name ORDER BY datetime_fmt) - peak_temp) AS abs_diff,\r\
  \n        datetime_fmt,\r\n        source_table_name,\r\n        battery_name\r\n\
  \    FROM abd1_mixers_all\r\n     WHERE (\r\n        {% if from_dttm %}\r\n    \
  \        datetime_fmt > '{{ from_dttm }}' AND\r\n        {% endif %}\r\n       \
  \ {% if to_dttm %}\r\n            datetime_fmt < '{{ to_dttm }}' AND\r\n       \
  \ {% endif %}\r\n        battery_name not in ('trail', '')\r\n    )"
